plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}
group = 'dev.emily'
version = '0.1.0'
java { toolchain { languageVersion = JavaLanguageVersion.of(21) }; withSourcesJar() }
repositories { mavenCentral() }
neoForge {
    version = '21.1.252'
    runs {
        client { client(); gameDirectory = file(providers.gradleProperty('economyRunRoot').getOrElse('run') + '/client') }
        server { server(); gameDirectory = file(providers.gradleProperty('economyRunRoot').getOrElse('run') + '/server'); programArgument '--nogui' }
    }
    mods { economy { sourceSet sourceSets.main } }
    // Command permission tests exercise the real Minecraft command source and dispatcher.
    addModdingDependenciesTo(sourceSets.test)
}
dependencies {
    implementation('org.xerial:sqlite-jdbc:3.53.4.0') { transitive = false }
    jarJar('org.xerial:sqlite-jdbc:3.53.4.0') {
        transitive = false
        version { strictly '[3.53.4.0]'; prefer '3.53.4.0' }
    }
    additionalRuntimeClasspath('org.xerial:sqlite-jdbc:3.53.4.0') { transitive = false }
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
configurations {
    processProbeRuntime {
        canBeConsumed = false
        extendsFrom implementation
    }
}
test {
    useJUnitPlatform()
    // Standalone storage probes use stdout as a protocol and do not load Minecraft.
    systemProperty 'economy.test.classpath',
            files(sourceSets.test.output, sourceSets.main.output, configurations.processProbeRuntime).asPath
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = 21 }
// Forward the development console so the server can be stopped with its `stop` command.
tasks.named('runServer', JavaExec) { standardInput = System.in }

// Run only against a stopped world; this task never starts Minecraft.
tasks.register('prepareEconomyUpgrade', JavaExec) {
    group = 'economy maintenance'
    description = 'Prepare a validated offline complete-world backup before a schema upgrade.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'dev.emily.economy.storage.UpgradeBackup'
    if (providers.gradleProperty('economyWorld').isPresent()) {
        args providers.gradleProperty('economyWorld').get()
    }
}

tasks.register('backupEconomyWorld', JavaExec) {
    group = 'economy maintenance'
    description = 'Back up a cleanly stopped complete world.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'dev.emily.economy.storage.WorldBackup'
    if (providers.gradleProperty('economyWorld').isPresent()) args 'backup', providers.gradleProperty('economyWorld').get()
}
tasks.register('restoreEconomyWorld', JavaExec) {
    group = 'economy maintenance'
    description = 'Validate and restore a complete backup into a new separate destination.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'dev.emily.economy.storage.WorldBackup'
    if (providers.gradleProperty('economyBackup').isPresent() && providers.gradleProperty('economyRestoreDestination').isPresent()) {
        args 'restore', providers.gradleProperty('economyBackup').get(), providers.gradleProperty('economyRestoreDestination').get()
    }
}
